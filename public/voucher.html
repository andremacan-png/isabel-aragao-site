* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'PJS',Arial,sans-serif; background:#F7F3EF; min-height:100vh; padding:28px 20px 60px 20px; }
.top { max-width:900px; margin:0 auto 22px auto; }
h1 { font-size:22px; font-weight:800; color:#1E1145; margin-bottom:4px; }
.dica { font-size:13px; color:#8A7FA8; }
.form {
  max-width:900px; margin:0 auto 20px auto; background:white;
  border:1px solid #E9E2D8; border-radius:16px; padding:20px 22px;
  display:grid; grid-template-columns:1fr 1fr; gap:14px 18px;
}
.fld label { display:block; font-size:11px; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:#E8823A; margin-bottom:5px; }
.fld input, .fld textarea {
  width:100%; border:1.5px solid #D9CFC2; border-radius:10px; padding:10px 12px;
  font-family:'PJS',Arial,sans-serif; font-size:16px; color:#1E1145; font-weight:700;
  text-transform:uppercase; background:#F7F3EF; outline:none;
}
.fld input:focus, .fld textarea:focus { border-color:#E8823A; }
.fld.wide { grid-column:1 / -1; }
textarea { resize:vertical; min-height:52px; }
.botoes { grid-column:1 / -1; display:flex; gap:10px; flex-wrap:wrap; }
button {
  font-family:'PJS',Arial,sans-serif; font-size:15px; font-weight:800;
  border:none; border-radius:100px; padding:12px 26px; cursor:pointer;
}
.btn-img { background:#E8823A; color:white; }
.btn-print { background:#1E1145; color:white; }
button:hover { opacity:0.9; }
.preview { max-width:900px; margin:0 auto; }
canvas { width:100%; height:auto; border-radius:14px; box-shadow:0 8px 30px rgba(30,17,69,0.18); }
@media print {
  body * { display:none !important; }
  body { padding:0; background:white; }
  .preview, .preview canvas { display:block !important; box-shadow:none; border-radius:0; width:190mm; margin:10mm auto; }
}

const cv = document.getElementById('cv');
const cx = cv.getContext('2d');
const ROXO = '#62508C';

// x inicial do painel direito + linhas medidas na arte (px @2480×1169)
const X = 940;
const LINHAS = { para: 208, serv: 494, msg: 754, de: 918 };  // medidas na arte

function quebra(texto, fonte, maxw) {
  cx.font = fonte;
  const palavras = texto.split(/\s+/).filter(Boolean);
  const linhas = [];
  let atual = '';
  for (const p of palavras) {
    const teste = atual ? atual + ' ' + p : p;
    if (cx.measureText(teste).width > maxw && atual) { linhas.push(atual); atual = p; }
    else atual = teste;
  }
  if (atual) linhas.push(atual);
  return linhas;
}

// desenha bloco com fim ancorado logo acima da linha do campo
function blocoAncorado(linhas, tam, linhaY, espacamento) {
  let y = linhaY - 22 - (linhas.length - 1) * espacamento;
  for (const l of linhas) { cx.fillText(l, X, y, 1360); y += espacamento; }
}

// auto-fit: reduz a fonte até caber em maxLinhas
function ajustar(texto, peso, tamMax, tamMin, maxLinhas, maxw) {
  for (let t = tamMax; t >= tamMin; t -= 2) {
    const ls = quebra(texto, peso + ' ' + t + 'px PJS', maxw);
    if (ls.length <= maxLinhas) return { linhas: ls, tam: t };
  }
  const ls = quebra(texto, peso + ' ' + tamMin + 'px PJS', maxw).slice(0, maxLinhas);
  return { linhas: ls, tam: tamMin };
}

function desenhar() {
  cx.clearRect(0, 0, cv.width, cv.height);
  cx.drawImage(BG, 0, 0);
  cx.fillStyle = ROXO;
  const para = document.getElementById('para').value.toUpperCase();
  const de   = document.getElementById('de').value.toUpperCase();
  const serv = document.getElementById('servicos').value.toUpperCase();
  const msg  = document.getElementById('mensagem').value;  // mensagem SEM caps (recado pessoal)
  const MAXW = 1360;

  cx.font = '800 60px PJS';
  cx.fillText(para, X, LINHAS.para - 20, MAXW);

  const aServ = ajustar(serv, '700', 46, 34, 3, MAXW);
  cx.font = '700 ' + aServ.tam + 'px PJS';
  blocoAncorado(aServ.linhas, aServ.tam, LINHAS.serv, aServ.tam + 14);

  const aMsg = ajustar(msg, 'italic 600', 44, 28, 3, MAXW);
  cx.font = 'italic 600 ' + aMsg.tam + 'px PJS';
  blocoAncorado(aMsg.linhas, aMsg.tam, LINHAS.msg, aMsg.tam + 12);

  cx.font = '800 52px PJS';
  cx.fillText(de, X, LINHAS.de - 20, MAXW);
}

function baixar() {
  desenhar();
  const a = document.createElement('a');
  const nome = (document.getElementById('para').value || 'voucher').trim().replace(/\s+/g,'_');
  a.download = 'voucher_' + nome + '.png';
  a.href = cv.toDataURL('image/png');
  a.click();
}

['para','de','servicos','mensagem'].forEach(id => document.getElementById(id).addEventListener('input', desenhar));
BG.onload = () => document.fonts.load('800 62px PJS').then(desenhar);
